<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in — Integrity Care Solutions</title>
  <link rel="icon" href="/ICRfavicon.ico">
  <script src="https://cdn.auth0.com/js/auth0-spa-js/2.0/auth0-spa-js.production.js"></script>
  <script src="/auth.js"></script>
  <style>
    :root {
      --bg: #0f1419;
      --card: #1a222c;
      --accent: #e8a33d;
      --text: #e6edf3;
      --muted: #8b949e;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 1.5rem;
    }
    .card {
      background: var(--card);
      border-radius: 12px;
      padding: 2.5rem 2rem;
      max-width: 420px;
      width: 100%;
      text-align: center;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    }
    .logo { width: 64px; height: 64px; border-radius: 50%; margin-bottom: 1rem; }
    h1 { font-size: 1.4rem; margin: 0 0 0.5rem; }
    p { color: var(--muted); font-size: 0.95rem; line-height: 1.5; margin: 0 0 1.5rem; }
    button {
      background: var(--accent);
      color: #0f1419;
      border: none;
      border-radius: 8px;
      padding: 0.85rem 1.5rem;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
    }
    button:hover { filter: brightness(1.05); }
    .note { font-size: 0.8rem; color: var(--muted); margin-top: 1.25rem; }
    .err { color: #f87171; font-size: 0.85rem; margin-top: 1rem; min-height: 1.2em; }
  </style>
</head>
<body>
  <div class="card">
    <img class="logo" src="/images/myintegritylogo.jpg" alt="Integrity Care Solutions">
    <h1>Sign in to continue</h1>
    <p>This site is for members. Please sign in with your account to view the full site.</p>
    <button id="loginBtn" type="button">Sign in</button>
    <div class="err" id="err"></div>
    <p class="note">This is a soft gate — it keeps casual visitors out but is not hard security.</p>
  </div>

  <script>
    (function () {
      var errEl = document.getElementById('err');
      var btn = document.getElementById('loginBtn');

      function showErr(msg) { errEl.textContent = msg || ''; }

      btn.addEventListener('click', function () {
        showErr('');
        window.ICSAuth.login();
      });

      // If already authed, bounce straight back.
      if (window.ICSAuth.isAuthenticated()) {
        window.location.replace(window.ICSAuth.getReturnUrl());
      }
    })();
  </script>
</body>
</html>
